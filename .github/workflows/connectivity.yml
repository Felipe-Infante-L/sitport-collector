name: SITPORT connectivity
on:
  workflow_dispatch:
  push:
    paths:
      - probe.mjs
      - .github/workflows/connectivity.yml
permissions:
  contents: read
jobs:
  probe:
    name: Probe SITPORT (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Query all eight public sources
        run: node probe.mjs
